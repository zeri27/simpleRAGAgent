<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple RAG Agent</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <button class="new-chat-btn" onclick="startNewConversation()">+ New Chat</button>
    <div class="conversations-list" id="conversations-list"></div>
    <div class="sidebar-settings">
      <label>
        <input type="checkbox" id="memory-toggle"> Require Knowledge Context
      </label>
    </div>
  </aside>

  <!-- Main View -->
  <main class="main-content">
    <div class="chat-container" id="chat-container"></div>
    <div class="input-area">
      <div class="input-wrapper">
        <textarea id="user-input" placeholder="Ask a question..." onkeydown="handleKeyDown(event)"></textarea>
        <button class="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </main>

  <script>
    let activeConversationId = null;
    marked.setOptions({ breaks: true });
    function renderMarkdown(el, text) {
      el.innerHTML = DOMPurify.sanitize(marked.parse(text));
      el.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
    }

    async function loadConversations() {
      const res = await fetch('/api/conversations');
      const convs = await res.json();
      const listEl = document.getElementById('conversations-list');
      listEl.innerHTML = '';

      convs.forEach(c => {
        const btn = document.createElement('button');
        btn.className = `conv-item ${c.id === activeConversationId ? 'active' : ''}`;
        btn.innerText = c.title || 'Untitled Chat';
        btn.onclick = () => selectConversation(c.id);
        listEl.appendChild(btn);
      });

      if (!activeConversationId && convs.length > 0) {
        selectConversation(convs[0].id);
      }
    }

    async function startNewConversation() {
      // 1. Fetch current conversations
      const resList = await fetch('/api/conversations');
      const convs = await resList.json();

      // 2. If the active conversation exists and has 0 messages, keep the user on it
      if (activeConversationId) {
        const activeRes = await fetch(`/api/conversations/${activeConversationId}`);
        if (activeRes.ok) {
          const activeData = await activeRes.json();
          if (!activeData.messages || activeData.messages.length === 0) {
            // Active chat is already fresh/empty - focus input and abort creation
            document.getElementById('user-input').focus();
            return;
          }
        }
      }

      // 3. check if any existing conversation is named "New Conversation" with 0 messages
      const existingEmpty = convs.find(c => c.title === 'New Conversation' && (!c.messages || c.messages.length === 0));
      if (existingEmpty) {
        selectConversation(existingEmpty.id);
        document.getElementById('user-input').focus();
        return;
      }

      // 4. Create new conversation only when needed
      const res = await fetch('/api/conversations', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: 'New Conversation' })
      });
      const data = await res.json();
      activeConversationId = data.id;
      await loadConversations();
      renderMessages([]);
      document.getElementById('user-input').focus();
    }

    async function selectConversation(id) {
      activeConversationId = id;
      await loadConversations();
      const res = await fetch(`/api/conversations/${id}`);
      const data = await res.json();
      renderMessages(data.messages || []);
    }

    function renderMessages(messages) {
      const container = document.getElementById('chat-container');
      container.innerHTML = '';
      messages.forEach(msg => appendMessageElement(msg.role, msg.content));
      scrollToBottom();
    }

    function appendMessageElement(role, text) {
      const container = document.getElementById('chat-container');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;
      if (role === 'assistant') {
        renderMarkdown(msgDiv, text);
      } else {
        msgDiv.innerText = text;
      }
      container.appendChild(msgDiv);
      scrollToBottom();
      return msgDiv;
    }

    function scrollToBottom() {
      const container = document.getElementById('chat-container');
      container.scrollTop = container.scrollHeight;
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    async function sendMessage() {
      const inputEl = document.getElementById('user-input');
      const sendBtn = document.querySelector('.send-btn');
      const newChatBtn = document.querySelector('.new-chat-btn');

      const query = inputEl.value.trim();
      if (!query) return;

      inputEl.disabled = true;
      sendBtn.disabled = true;
      newChatBtn.disabled = true;

      try {
        if (!activeConversationId) {
          await startNewConversation();
        }

        appendMessageElement('user', query);
        inputEl.value = '';

        const memoryRequired = document.getElementById('memory-toggle').checked;
        const assistantMsgDiv = appendMessageElement('assistant', '');

        // Send request and process Server-Sent Event stream
        const response = await fetch('/api/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            conversation_id: activeConversationId,
            query: query,
            memory_required: memoryRequired
          })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let accumulatedText = '';

        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              try {
                const parsed = JSON.parse(line.slice(6));
                accumulatedText += parsed.content;
                renderMarkdown(assistantMsgDiv, accumulatedText);
                scrollToBottom();
              } catch (err) {
                console.error('Bad SSE line:', line, err);
              }
            }
          }
        }
        // Initial boot
        loadConversations();
      } catch (error) {
        console.error("Error streaming response:", error);
      } finally {
        inputEl.disabled = false;
        sendBtn.disabled = false;
        newChatBtn.disabled = false;
        inputEl.focus();
      }
    }
  </script>
</body>
</html>
